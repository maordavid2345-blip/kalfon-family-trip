@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191a;--card:#182526;--ink:#eef3f1;--mut:#9db0ad;--line:#2a3b3c}}
:root[data-theme="dark"]{--bg:#10191a;--card:#182526;--ink:#eef3f1;--mut:#9db0ad;--line:#2a3b3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,Arial,sans-serif;line-height:1.55}
.hero{background:linear-gradient(180deg,#0f766ecc,#155e75b3 55%,#7c2d12e6),var(--fam) center 52%/cover;color:#fff;text-align:center;padding:30px 16px 54px}
.hero .em{font-size:42px;letter-spacing:6px}
.hero h1{margin:6px 0 4px;font-size:clamp(26px,6vw,42px);font-weight:900}
.hero p{margin:0;opacity:.92}
.cd{display:inline-block;margin-top:10px;background:#0004;border-radius:14px;padding:6px 16px;font-weight:700}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-26px auto 0;padding:0 12px;max-width:900px}
.tab{border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 14px;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 4px 14px #0002;flex:1 1 110px;max-width:190px}
.tab small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.tab.on{background:var(--a);color:#fff}.tab.on small{color:#e6fffb}
main{max-width:820px;margin:22px auto;padding:0 14px 90px}
section{display:none}section.on{display:block}
.banner{border-radius:20px;color:#fff;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.banner h2{margin:0;font-size:25px}.banner p{margin:4px 0 0;opacity:.95}
.banner .big{position:absolute;left:10px;top:-6px;font-size:84px;opacity:.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:18px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--b);transition:width .3s}
.gear{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.gear label{display:flex;gap:8px;align-items:center;background:var(--bg);padding:9px 12px;border-radius:12px;cursor:pointer}
.gear input{width:18px;height:18px;accent-color:var(--a)}
.gear input:checked+span{text-decoration:line-through;color:var(--mut)}
.gear .hot{outline:2px solid var(--b)}
.tl{margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 62px 20px 0}
.tl li:before{content:"";position:absolute;right:23px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.t{position:absolute;right:0;top:0;width:52px;height:28px;border-radius:14px;background:var(--a);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.tl li.now .t{background:#dc2626;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.6}}
.tl b{display:block;font-size:16px}
.tl span{color:var(--mut);font-size:14px}
.note{display:inline-block;background:#fef3c7;color:#78350f!important;border-radius:10px;padding:3px 10px;font-size:13px;margin-top:4px}
.dist{display:inline-block;background:#dbeafe;color:#1e3a8a!important;border-radius:10px;padding:3px 10px;font-size:13px;margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btns a,.btns button{font:inherit;text-decoration:none;font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;border:0;cursor:pointer}
.waze{background:#33ccff;color:#012a36}
.pic{background:var(--bg);color:var(--ink);border:1px solid var(--line)!important}
.fact{background:linear-gradient(135deg,#ede9fe,#e0f2fe);color:#312e81;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:10px}
.eat{background:#ffedd5;color:#7c2d12;border-radius:14px;padding:12px 14px;margin-top:6px;font-size:14px}
.loc{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.go{font:inherit;font-weight:700;border:0;background:var(--a);color:#fff;border-radius:12px;padding:10px 20px;cursor:pointer;margin-top:8px}
.go.red{background:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eat{background:#2b2015;color:#fed7aa}:root:not([data-theme="light"]) .note{background:#3b3010;color:#fde68a!important}:root:not([data-theme="light"]) .fact{background:#1e1b3a;color:#c7d2fe}:root:not([data-theme="light"]) .dist{background:#172554;color:#bfdbfe!important}}
.q h3{font-size:19px}
.opt{display:block;width:100%;text-align:right;font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#14532d}
.opt.no{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.pill{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.inp{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.res{text-align:center}.res .n{font-size:56px;font-weight:900}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-20px;font-style:normal;font-size:24px;animation:f 2.2s linear forwards}
@keyframes f{to{transform:translateY(105vh) rotate(540deg)}}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.modal img{width:100%;border-radius:12px;margin-bottom:8px;display:block}
.ph{border-radius:14px;padding:30px 12px;text-align:center;background:linear-gradient(135deg,#0f766e,#b45309);color:#fff;margin-bottom:8px}
